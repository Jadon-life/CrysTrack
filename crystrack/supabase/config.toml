# LOCAL ONLY. Never link, push, pull, or add hosted project references.
project_id = "crystrack-local-free"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 15
[db.migrations]
enabled = false
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/api/auth/callback"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = false
[analytics]
enabled = false
