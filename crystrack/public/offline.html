<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081523">
  <meta name="robots" content="noindex, nofollow">
  <title>You're offline · CrysTrack</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      color: #f2f7fc; background: radial-gradient(circle at 50% 10%, #163e58, #081523 60%, #050914); }
    main { width: min(100%, 440px); padding: 36px 28px; border: 1px solid rgba(255,255,255,.17);
      border-radius: 26px; background: rgba(255,255,255,.055); box-shadow: 0 24px 70px rgba(0,0,0,.26); }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 5vw, 30px); line-height: 1.2; }
    p { margin: 0 0 24px; font-size: 16px; line-height: 1.6; color: #dae6f1; }
    a { display: inline-flex; min-height: 44px; align-items: center; padding: 10px 18px;
      border: 1px solid #81c5e5; border-radius: 12px; color: #eaf8ff; text-decoration: none;
      background: rgba(42,124,168,.30); font-size: 15px; font-weight: 650; }
    a:focus-visible { outline: 3px solid #b5e7ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main role="main">
    <h1>You're offline</h1>
    <p>CrysTrack couldn't reach the network. Your private tasks and finances are not stored in this offline page. Reconnect to load your workspace.</p>
    <a href="/">Try again when connected</a>
  </main>
</body>
</html>
