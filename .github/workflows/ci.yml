name: CrysTrack CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crystrack

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OPENROUTER_API_KEY: ci-placeholder
      OPENROUTER_CHAT_MODEL: google/gemma-4-26b-a4b-it:free
      OPENROUTER_ANALYSIS_MODEL: nvidia/nemotron-3-super-120b-a12b:free
      EXCHANGE_RATE_API_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder
      TELEGRAM_BOT_TOKEN: ci-placeholder
      TELEGRAM_BOT_USERNAME: ci-placeholder
      TELEGRAM_WEBHOOK_SECRET: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crystrack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
