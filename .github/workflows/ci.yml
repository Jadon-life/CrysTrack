name: CrysTrack CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/crystrack-premium-sep28"

# Tests require no repository write permissions or deployment credentials.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: crystrack

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OPENROUTER_API_KEY: ci-placeholder
      OPENAI_CHAT_MODEL: gpt-5.4-mini
      OPENAI_ANALYSIS_MODEL: gpt-5.4-mini
      EXCHANGE_RATE_API_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder
      TELEGRAM_BOT_TOKEN: ci-placeholder
      TELEGRAM_BOT_USERNAME: ci-placeholder
      TELEGRAM_WEBHOOK_SECRET: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crystrack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  preview-safety:
    name: Synthetic boundary tests (local Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crystrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crystrack/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Local loopback build/browser only: no Vercel action, environment or secrets.
      - run: npm run test:preview
